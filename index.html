<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <link rel="stylesheet" href="style.css">
        <script src="popup.js" defer></script>
    </head>
    <body>
        <div class="main-extension">
            <div class="title">Youtube No Distraction Extension</div>
            <div class="checkboxes">
                <div class="checkbox">
                    <input type="checkbox" id="home-videos" name="home-videos">
                    <label for="home-videos">Hide Home Videos</label>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="recommendations" name="recommendations">
                    <label for="recommendations">Hide Recommendations</label>
                </div>

            </div>
        </div>
    </body>
</html>
